          "id": 19,
          "pluginVersion": "11.0.0",
          "title": "Seuils et lecture",
          "type": "text",
          "options": {
            "mode": "markdown",
            "content": "## Seuils\n\n- Vert: inférieur à 80 %.\n- Orange: à partir de 80 %.\n- Rouge: à partir de 90 %.\n- Les panneaux `Alertes` fonctionnent comme `DiskPressure`: `OK` = 0, `ALERTE` = 1.\n\n## Lecture pratique\n\n- `FPM - par pod` sert à voir si un replica individuel consomme trop.\n- `FPM - total replicas` sert à mesurer l’impact cumulé quand tu passes à 2 ou 3 replicas.\n- Les calculs utilisent `kube_node_status_allocatable`, donc la base de calcul est la capacité réellement utilisable par Kubernetes."
          }
        },
