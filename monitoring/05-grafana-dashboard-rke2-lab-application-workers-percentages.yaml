            "mode": "markdown",
            "content": "# RKE2 Lab - Application Workers - Pourcentages\n\n| Élément | Filtre | Objectif |\n|---|---|---|\n| Workers applicatifs | `workload-role=app` | Exclure master et worker PostgreSQL dédié |\n| FPM | `blog-back-fpm-.*` | Suivre chaque pod et le total des replicas |\n| Nginx | `blog-back-nginx-.*` | Suivre le pod reverse proxy applicatif |\n| PostgreSQL reader local app | `pg-lab-postgresql-read-0` | Suivre le reader présent sur worker applicatif |\n\nLes pourcentages sont calculés par rapport à la capacité Kubernetes `allocatable` de la node qui héberge le pod."
