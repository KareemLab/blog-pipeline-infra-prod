apiVersion: v1
kind: ConfigMap
metadata:
  name: blog-back-nginx-config
  namespace: lab-k8s
  labels:
    app.kubernetes.io/name: blog-back-nginx
    app.kubernetes.io/part-of: blog-back
data:
  default.conf: |
    server {
        listen 80;
        listen [::]:80;

        server_name _;

        root /app/public;
        index index.php;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass blog-back-fpm:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
        }

        location ~ \.php$ {
            return 404;
        }

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;
    }
