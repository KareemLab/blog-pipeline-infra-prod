apiVersion: batch/v1
kind: Job
metadata:
  name: blog-back-seed
  namespace: lab-k8s
  labels:
    app.kubernetes.io/name: blog-back-seed
    app.kubernetes.io/part-of: blog-back
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-back-seed
        app.kubernetes.io/part-of: blog-back
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-2
      imagePullSecrets:
        - name: kuberneteshub
      containers:
        - name: seed
          image: kareemdev2/blog-back-fpm:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: blog-back-secret
          volumeMounts:
            - name: env-file
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          command:
            - php
            - bin/console
            - app:seed:articles
            - --env=preprod
      volumes:
        - name: env-file
          secret:
            secretName: blog-back-env-file
