apiVersion: batch/v1
kind: Job
metadata:
  name: cluster-dns-diagnostic
  namespace: lab-k8s
  labels:
    app.kubernetes.io/name: cluster-dns-diagnostic
    app.kubernetes.io/part-of: bootstrap
    app.kubernetes.io/component: diagnostic
spec:
  suspend: true
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-dns-diagnostic
        app.kubernetes.io/part-of: bootstrap
        app.kubernetes.io/component: diagnostic
    spec:
      restartPolicy: Never
      nodeName: rke2-worker-1
      containers:
        - name: dns-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "===== /etc/resolv.conf ====="
              cat /etc/resolv.conf
              echo
              echo "===== nameserver ====="
              awk '/^nameserver / {print $2; exit}' /etc/resolv.conf
