apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog-production
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:KareemLab/blog-pipeline-infra-prod.git
    targetRevision: main
    path: production-manifest/apps/blog
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: blog-production
