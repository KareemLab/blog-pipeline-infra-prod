deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1

  nodeSelector:
    kubernetes.io/hostname: rke2-worker-2

  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

gateway:
  nodeSelector:
    kubernetes.io/hostname: rke2-worker-2

  nginxConfig:
    resolver: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false
