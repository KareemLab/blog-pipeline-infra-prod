            "content": "# RKE2 Lab - BDD\n\n| Élément | Filtre | Objectif |\n|---|---|---|\n| Primary writer | `pg-lab-postgresql-primary-0` | Suivre PostgreSQL writer sur `rke2-worker-2` |\n| Readers actifs | `pg-lab-postgresql-read-0`, `pg-lab-postgresql-read-1` | Suivre les PostgreSQL readers sur `rke2-worker-1` et `rke2-worker-2` |\n| Seuil de sécurité | `80%` | Stopper le stress avant saturation worker ou pod |\n\nLes panels PostgreSQL CPU/RAM sont calculés en pourcentage des `limits` du container `postgresql`. Les panels workers utilisent les métriques node-exporter et la capacité Kubernetes `allocatable`, afin d’être cohérents avec la surveillance de type `kubectl top nodes`."
