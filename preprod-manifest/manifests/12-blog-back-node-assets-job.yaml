apiVersion: batch/v1
kind: Job
metadata:
  name: blog-back-node-assets
  namespace: lab-k8s
  labels:
    app.kubernetes.io/name: blog-back-node-assets
    app.kubernetes.io/part-of: blog-back
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-back-node-assets
        app.kubernetes.io/part-of: blog-back
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: rke2-worker-2
      imagePullSecrets:
        - name: kuberneteshub
      containers:
        - name: node-assets
          image: kareemdev2/blog-back-node:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: blog-back-secret
          volumeMounts:
            - name: assets
              mountPath: /app/public/build
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: blog-back-assets
